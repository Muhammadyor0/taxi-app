<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taksi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; background: #fff;
         color: #111; text-align: center; }
  #choose { padding: 24px; }
  h1 { margin: 60px 0 20px; }
  button { display: block; width: calc(100% - 32px); padding: 16px;
           margin: 12px 16px; font-size: 18px; border: none;
           border-radius: 12px; background: #ffcc00; color: #111; }
  #screen { display: none; }
  #screen h1 { margin: 12px 0; font-size: 20px; }
  #map { height: 65vh; width: 100%; }
  #status { padding: 8px; font-size: 14px; color: #555; }
</style>
</head>
<body>
  <div id="choose">
    <h1>Xush kelibsiz!</h1>
    <p id="name"></p>
    <button onclick="pick('yolovchi')">🧍 Men yo’lovchiman</button>
    <button onclick="pick('taksist')">🚕 Men taksistman</button>
  </div>
  <div id="screen">
    <h1 id="title"></h1>
    <div id="map"></div>
    <div id="status">Joylashuv aniqlanmoqda...</div>
    <button onclick="resetRole()">Rolni o’zgartirish</button>
  </div>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  const user = tg.initDataUnsafe.user;
  if (user) document.getElementById('name').textContent = user.first_name;

  let map, me, taxis = [], started = false;
  let center = [41.311, 69.279];

  function show(role) {
    document.getElementById('choose').style.display = 'none';
    document.getElementById('screen').style.display = 'block';
    document.getElementById('title').textContent =
      role === 'taksist' ? '🚕 Taksist bo’limi' : '🧍 Yo’lovchi bo’limi';
    if (!started) { started = true; startMap(); }
    else setTimeout(() => map.invalidateSize(), 100);
  }
  function pick(role) { localStorage.setItem('role', role); show(role); }
  function resetRole() {
    localStorage.removeItem('role');
    document.getElementById('screen').style.display = 'none';
    document.getElementById('choose').style.display = 'block';
  }

  function startMap() {
    map = L.map('map').setView(center, 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    me = L.marker(center).addTo(map).bindPopup('Siz shu yerdasiz');
    if (!navigator.geolocation) {
      document.getElementById('status').textContent = 'Joylashuv qo’llab-quvvatlanmaydi';
      return;
    }
    navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy: true });
  }

  function onPos(p) {
    center = [p.coords.latitude, p.coords.longitude];
    me.setLatLng(center);
    if (taxis.length === 0) { map.setView(center, 16); makeTaxis(); }
    document.getElementById('status').textContent =
      'Yaqin atrofda ' + taxis.length + ' ta taksi (demo)';
  }
  function onErr() {
    document.getElementById('status').textContent =
      'Joylashuvga ruxsat bering (Telegram yoki telefon sozlamalarida)';
  }

  function makeTaxis() {
    const icon = L.divIcon({ html: '<div style="font-size:26px">🚕</div>',
      className: '', iconSize: [30, 30] });
    for (let i = 0; i < 5; i++) {
      const pos = [center[0] + (Math.random() - 0.5) * 0.01,
                   center[1] + (Math.random() - 0.5) * 0.01];
      taxis.push(L.marker(pos, { icon: icon }).addTo(map));
    }
    setInterval(() => {
      taxis.forEach(t => {
        const a = t.getLatLng();
        t.setLatLng([a.lat + (Math.random() - 0.5) * 0.0004,
                     a.lng + (Math.random() - 0.5) * 0.0004]);
      });
    }, 3000);
  }

</script>
</body>
</html>
